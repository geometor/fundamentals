    <g class="svg-control-btn" data-action="zoom-out"><rect x="3.2137" y="-7.7003" width="0.8593" height="0.5544" /><text x="3.6433" y="-7.4231" style="font-size:0.2550px">−</text></g>
    <g class="svg-control-btn" data-action="reset"><rect x="4.1728" y="-7.7003" width="0.8593" height="0.5544" /><text x="4.6024" y="-7.4231" style="font-size:0.2550px">⟲</text></g>
