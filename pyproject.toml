[project]
name = "geometor-fundamentals"
dynamic = ["version"]
authors = [
  { name="geometor", email="github@geometor.com" },
]
description = "Foundational constructive geometry codex and the Fred W. Seelig archive."
readme = "README.rst"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sympy",
    "networkx",
    "geometor-model",
    "rich",
    "textual",
    "jinja2",
    "flask>=3.1.3",
]

[project.scripts]
fundamentals = "geometor.fundamentals.__main__:main"
fundamentals-review = "geometor.fundamentals.folio_review:main"

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geometor"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "geometor.fundamentals.__version__"}

[project.urls]
"Website" = "https://geometor.github.io/fundamentals"
"Repository" = "https://github.com/geometor/fundamentals"
"Issues" = "https://github.com/geometor/fundamentals/issues"

[tool.ruff]
lint.select = ["ANN", "D"]
lint.ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"