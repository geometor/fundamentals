[project]
name = "geometor-fundamentals"
dynamic = ["version"]
authors = [
  { name="geometor", email="github@geometor.com" },
]
description = "A library of fundamental geometric constructions and principles."
readme = "README.rst"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "textual",
    "rich",
    "jinja2",
]

[project.scripts]
fundamentals = "geometor.fundamentals.__main__:main"

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geometor"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "geometor.fundamentals.__version__"}

[project.urls]
"Website" = "https://geometor.github.io/fundamentals"
"Repository" = "https://github.com/geometor/fundamentals"
"Issues" = "https://github.com/geometor/fundamentals/issues"