    <g class="svg-control-btn" data-action="zoom-out"><rect x="7.7137" y="-5.6503" width="0.8593" height="0.5544" /><text x="8.1433" y="-5.3731" style="font-size:0.2550px">−</text></g>
    <g class="svg-control-btn" data-action="reset"><rect x="8.6728" y="-5.6503" width="0.8593" height="0.5544" /><text x="9.1024" y="-5.3731" style="font-size:0.2550px">⟲</text></g>
