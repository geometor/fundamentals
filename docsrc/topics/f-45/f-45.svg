    <g class="element-group" data-ref="V_1"><text class="label-halo" x="3.0288" y="-3.0045" font-family="sans-serif" font-size="0.3274" font-weight="600" stroke="#111111" stroke-width="0.0818" stroke-linejoin="round" fill="none">V<tspan dy="0.3em" font-size="75%">1</tspan></text><text class="label-fill" x="3.0288" y="-3.0045" font-family="sans-serif" font-size="0.3274" font-weight="600" fill="#f0f0f0">V<tspan dy="0.3em" font-size="75%">1</tspan></text></g>
    <g class="element-group" data-ref="V_2"><text class="label-halo" x="-2.6281" y="-3.0045" font-family="sans-serif" font-size="0.3274" font-weight="600" stroke="#111111" stroke-width="0.0818" stroke-linejoin="round" fill="none">V<tspan dy="0.3em" font-size="75%">2</tspan></text><text class="label-fill" x="-2.6281" y="-3.0045" font-family="sans-serif" font-size="0.3274" font-weight="600" fill="#f0f0f0">V<tspan dy="0.3em" font-size="75%">2</tspan></text></g>
    <g class="element-group" data-ref="V_3"><text class="label-halo" x="-2.6281" y="2.6523" font-family="sans-serif" font-size="0.3274" font-weight="600" stroke="#111111" stroke-width="0.0818" stroke-linejoin="round" fill="none">V<tspan dy="0.3em" font-size="75%">3</tspan></text><text class="label-fill" x="-2.6281" y="2.6523" font-family="sans-serif" font-size="0.3274" font-weight="600" fill="#f0f0f0">V<tspan dy="0.3em" font-size="75%">3</tspan></text></g>
    <g class="element-group" data-ref="V_4"><text class="label-halo" x="3.0288" y="2.6523" font-family="sans-serif" font-size="0.3274" font-weight="600" stroke="#111111" stroke-width="0.0818" stroke-linejoin="round" fill="none">V<tspan dy="0.3em" font-size="75%">4</tspan></text><text class="label-fill" x="3.0288" y="2.6523" font-family="sans-serif" font-size="0.3274" font-weight="600" fill="#f0f0f0">V<tspan dy="0.3em" font-size="75%">4</tspan></text></g>
    <g class="element-group" data-ref="M"><text class="label-halo" x="0.2004" y="-3.0045" font-family="sans-serif" font-size="0.3274" font-weight="600" stroke="#111111" stroke-width="0.0818" stroke-linejoin="round" fill="none">M</text><text class="label-fill" x="0.2004" y="-3.0045" font-family="sans-serif" font-size="0.3274" font-weight="600" fill="#f0f0f0">M</text></g>
