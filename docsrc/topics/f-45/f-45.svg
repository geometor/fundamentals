    <g class="element-group" data-ref="V_3"><circle class="Point given" cx="-2.8284" cy="2.8284" r="0.1554"><title>V_3 (-2.828, -2.828)</title></circle></g>
    <g class="element-group" data-ref="V_4"><circle class="Point given" cx="2.8284" cy="2.8284" r="0.1554"><title>V_4 (2.828, -2.828)</title></circle></g>
